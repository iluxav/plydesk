name: release

# Tag-driven, plus a manual button for dry runs. The tag is the version:
# v0.2.0 produces plydesk-v0.2.0-aarch64.tar.gz (macOS) and
# plydesk-v0.2.0-linux-x86_64.tar.gz.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (no release is published for a manual run)'
        required: false

jobs:
  build:
    # Both macOS builds come from Apple Silicon runners, which cross-compile to
    # Intel perfectly well. The obvious alternative — an Intel runner for the
    # Intel build — means queueing for the macos-13 pool, which is being retired
    # and left a job unassigned for a quarter of an hour on the first release.
    #
    # Linux builds on the oldest supported Ubuntu: the binary links the
    # system's WebKitGTK and glibc, so the build machine sets the floor for
    # every distro that can run it.
    #
    # `asset` names the archive; `native` marks the builds this runner can
    # execute, which are the ones the app runtime tests run on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: aarch64
            target: aarch64-apple-darwin
            os: macos-14
            bundle: app
            native: true
          - asset: x86_64
            target: x86_64-apple-darwin
            os: macos-14
            bundle: app
          - asset: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundle: deb
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK pulls in GTK, libsoup and JavaScriptCore; tao links dbus.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev

      # Node 24: the UI tests import TypeScript sources directly and rely on
      # the type stripping that is on by default from 23.6.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # core is its own package with its own target dir, so the unit-test
          # step rebuilds it from scratch unless it is cached too.
          workspaces: |
            src-tauri -> target
            core -> target
          key: ${{ matrix.target }}

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # The plugin lint is cheap and catches a mistake that unmounts the app at
      # runtime, so it runs before anything is built.
      - name: Lint plugins
        run: make lint-plugins

      # tauri-build embeds ui/dist, so the app crate cannot even compile its
      # tests until the frontend exists. The Tauri CLI rebuilds it later; the
      # second run is a couple of seconds.
      - name: Build the UI
        working-directory: ui
        run: npm run build

      - name: Unit tests
        # The live tests need a reachable host and are marked #[ignore], so
        # this runs only what can pass without one.
        run: |
          cargo test --release --manifest-path core/Cargo.toml
          node --experimental-vm-modules --test "ui/tests/*.test.mjs"

      # The app runtime tests cover the permission gateway. Native for the
      # runner only: the Intel Mac binaries cannot run on Apple Silicon, and
      # --target shares the release artifacts with the build below.
      - name: App runtime tests
        if: matrix.native
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # The npm CLI, not `cargo install tauri-cli`. That step compiled the CLI
      # from source on every run and took 414 of the job's 707 seconds; this
      # one is a prebuilt binary that npm ci has already fetched.
      #
      # The bundle's version comes from the tag, so a release can never ship
      # an app that reports the previous number. Manual runs keep the file's.
      - name: Build
        working-directory: src-tauri
        run: |
          CONFIG='{}'
          case "${GITHUB_REF_NAME}" in
            v[0-9]*) CONFIG="{\"version\":\"${GITHUB_REF_NAME#v}\"}" ;;
          esac
          node ../ui/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config "$CONFIG"

      # A --target build nests the output under the triple.
      - name: Package
        id: package
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          # An `if` rather than `[ … ] && …`: that form survives `set -e` only
          # because the failing test precedes the `&&`, which is too subtle to
          # leave for the next person to edit around.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag || 'dev' }}"
          fi
          NAME="plydesk-${TAG}-${{ matrix.asset }}.tar.gz"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # No parent directory in the archive: install.sh expects
            # plydesk.app at the top level.
            tar -czf "$NAME" -C macos plydesk.app
          else
            # The .deb's own tree with /usr taken off: bin/, lib/plydesk/ and
            # share/, which install.sh unpacks into a prefix. Tauri looks for
            # the bundled plugins at <bin>/../lib/plydesk, so the layout is
            # what makes them load.
            tar -czf "$NAME" -C deb/*/data/usr bin lib share
          fi
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$PWD/$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: plydesk-${{ matrix.asset }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS covering every architecture, because install.sh fetches
      # exactly one file to verify against.
      - name: Collect checksums
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # Re-running a tag build after a partial failure must not fail on the
      # release it already made: if one exists, its assets are replaced.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists; replacing its assets"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "plydesk ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'NOTES'
          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          ```

          The installer verifies the checksum before writing anything.

          **macOS:** the app is not notarised by Apple. macOS quarantines
          anything a *browser* downloads, so a downloaded archive would be
          refused — installed with `curl` it is not quarantined and simply
          opens. To remove it: `rm -rf /Applications/plydesk.app`

          **Linux (x86_64):** installs into `~/.local` and adds a launcher
          entry. It uses the system's WebKitGTK 4.1 (`webkit2gtk-4.1` on Arch,
          `libwebkit2gtk-4.1-0` on Debian and Ubuntu); the installer names
          anything missing.
          NOTES
          )" \
            dist/*
